<script>
/* ============================================================
   KIMIND‑CORE · PROCESSOR‑ENGINE
   Lädt Aufgaben → verarbeitet → erzeugt Code → zeigt Output
   ============================================================ */

let frame = 0;

/* TASK‑QUEUE (alte + neue Aufgaben) */
const TASKS = [
    { id: "B-INIT",   mod: "B",   payload: "boot" },
    { id: "H-LOAD",   mod: "H",   payload: "hall" },
    { id: "T-CYCLE",  mod: "T",   payload: "turn" },
    { id: "U-UPDATE", mod: "U",   payload: "sync" },
    { id: "Y-ENERGY", mod: "Y",   payload: "charge" },
    { id: "Z-FINAL",  mod: "Z",   payload: "seal" }
];

/* MODULE‑PROCESSOR */
function PROCESS(task){
    return {
        id: task.id,
        module: task.mod,
        input: task.payload,
        output: `${task.mod}.core(${task.payload})`,
        status: "processed",
        frame
    };
}

/* PIPELINE‑ENGINE */
function PIPELINE(){
    const processed = TASKS.map(t => PROCESS(t));

    return {
        frame,
        count: processed.length,
        tasks: processed
    };
}

/* CODE‑GENERATOR */
function CODEGEN(task){
    return `
/* ${task.id} · ${task.module} */
function ${task.module}_core(){
    return "${task.output}";
}
`;
}

/* MAIN‑ENGINE */
function ENGINE(){

    frame++;

    const pipe = PIPELINE();

    /* SYSTEM PANEL */
    document.getElementById("system").textContent = `
KIMIND‑CORE · PROCESSOR‑ENGINE
Frame: ${frame}
Tasks: ${pipe.count}
Status: ACTIVE
`;

    /* PIPELINE PANEL */
    document.getElementById("pipeline").textContent =
        JSON.stringify(pipe, null, 2);

    /* CODE PANEL */
    let codeOut = "";
    pipe.tasks.forEach(t => codeOut += CODEGEN(t));
    document.getElementById("code").textContent = codeOut;

    /* ASCII PANELS bleiben wie sie sind */
    document.getElementById("geo3d").textContent = geo3D();
    document.getElementById("amiga").textContent = amigaScene();
    document.getElementById("warp").textContent = warpTunnel();
    document.getElementById("gta").textContent = gta6();
}

setInterval(ENGINE, 150);
</script>
